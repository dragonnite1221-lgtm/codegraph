name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claude:
    name: Recorded local AI review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate local Antigravity review evidence
        env:
          EXPECTED_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 .github/scripts/test_validate_local_ai_review.py
          python3 .github/scripts/validate-local-ai-review.py
