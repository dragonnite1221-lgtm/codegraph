name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Vitest's native rolldown binding requires Node 20.19+, while the
          # published runtime dependencies support 20.12. Test both contracts.
          - node: '20.12.0'
            full-test: false
          - node: '20.19.0'
            full-test: true
          - node: '22'
            full-test: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: File size gate
        run: node scripts/check-file-size.cjs

      - name: Build
        run: npm run build

      - name: Test
        if: matrix.full-test
        run: npx vitest run

      - name: Minimum runtime smoke test
        if: ${{ !matrix.full-test }}
        run: node dist/bin/codegraph.js --version
